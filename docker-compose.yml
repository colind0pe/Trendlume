# ==============================================================================
# Trendlume - Docker Compose Orchestration
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trendlume-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: trendlume-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
