[project]
name = "trendlume-backend"
version = "0.2.0"
description = "Trendlume - AI Video Creation Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "edge-tts>=6.1.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "playwright>=1.62.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.6.0",
]
standalone = [
    "pyinstaller==6.22.3; sys_platform == 'darwin'",
    "pyinstaller==6.22.3; sys_platform != 'darwin'",
    "setuptools==80.9.0; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["src"]
timeout = 60
markers = [
    "e2e: browser smoke tests requiring an explicitly configured frontend",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "F821", "E501"]
