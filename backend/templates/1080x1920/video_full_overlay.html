<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1080">
    <meta name="template:media-height" content="1920">
    <meta name="template:video-frame-x" content="0">
    <meta name="template:video-frame-y" content="0">
    <meta name="template:video-frame-width" content="1080">
    <meta name="template:video-frame-height" content="1920">
    <style>
        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #090a0f;
            position: relative;
            box-sizing: border-box;
        }
        
        .main-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
        }
        
        /* 全屏视频槽位（0, 0, 1080, 1920） */
        .video-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-size: cover;
            background-position: center;
            background-image: url("{{image}}");
        }
        
        /* 顶部轻质毛玻璃悬浮微岛标题 */
        .video-title-wrapper {
            position: absolute;
            top: 210px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            max-height: 250px;
            box-sizing: border-box;
            padding: 20px 34px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
            z-index: 3;
            text-align: center;
        }
        
        .video-title {
            width: 100%;
            text-align: center;
            font-size: 70px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            text-wrap: balance;
        }
        
        /* 底部柔和渐变保护层（延伸至 820px 高度，自然承托居中字幕且不割裂全景动态） */
        .bottom-protection-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1080px;
            height: 820px;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.85) 0%,
                rgba(0, 0, 0, 0.48) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            z-index: 2;
            box-sizing: border-box;
            pointer-events: none;
        }
        
        /* 核心短视频解说字幕区：上提至 bottom: 420px 黄金阅读视域，避开平台底栏、音乐条及右侧互动图标 */
        .content {
            position: absolute;
            bottom: 420px;
            left: 50%;
            transform: translateX(-50%);
            width: 920px;
            box-sizing: border-box;
            text-align: center;
            z-index: 3;
            pointer-events: none;
        }
        
        .text {
            font-size: 42px;
            color: #ffffff;
            text-align: center;
            line-height: 1.45;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.7);
            white-space: pre-line;
            overflow-wrap: anywhere;
            text-wrap: balance;
        }
        
        /* 底部作者与品牌签名栏（贴底放置，独立于上方解说字幕） */
        .footer {
            position: absolute;
            bottom: 50px;
            left: 70px;
            right: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
            z-index: 3;
        }
        
        .author-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }
        
        .author {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        
        .author:empty, .author-desc:empty, .logo:empty {
            display: none;
        }
        
        .author-desc {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }
        
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
    
        /* Footer auto-collapse when all author/brand info is empty */
        .footer:not(:has(.author:not(:empty))):not(:has(.author-text:not(:empty))):not(:has(.author-desc:not(:empty))):not(:has(.logo:not(:empty))):not(:has(.brand-logo:not(:empty))) {
            display: none !important;
        }
        .author-bullet {
            display: none;
        }
        .author-name:has(.author-text:not(:empty)) .author-bullet {
            display: inline-block;
        }
        .author-name:has(span:not(.author-bullet):not(:empty)) .author-bullet {
            display: inline-block;
        }
    
        /* Title & Footer Auto-Collapse when empty */
        .video-title:empty, .title:empty, .title-text:empty, .main-headline:empty { display: none !important; }
        .header-section:not(:has(.video-title:not(:empty))):not(:has(.title:not(:empty))) { display: none !important; }
        .video-title-wrapper:not(:has(.video-title:not(:empty))) { display: none !important; }
        .top-header:not(:has(.title:not(:empty))):not(:has(.author-tag:not(:empty))) { display: none !important; }
        .title-group:not(:has(.title-text:not(:empty))) { display: none !important; }
        .author:empty, .author-text:empty, .author-desc:empty, .author-tag:empty, .logo:empty, .brand:empty, .brand-logo:empty { display: none !important; }
        .footer:not(:has(.author:not(:empty))):not(:has(.author-text:not(:empty))):not(:has(.author-desc:not(:empty))):not(:has(.logo:not(:empty))):not(:has(.brand-logo:not(:empty))) { display: none !important; }
        .footer-meta:not(:has(.author:not(:empty))) { display: none !important; }
        .footer-signature:not(:has(span:not(:empty))) { display: none !important; }
        .footer-area:not(:has(.author:not(:empty))) { display: none !important; }
        .footer-author:empty { display: none !important; }
    
        /* Enhanced Hero Text adjustments when title is empty */
        .left-column:not(:has(.title:not(:empty))) .accent-bar { display: none !important; }
        .left-column:not(:has(.title:not(:empty))) .warm-diamond { display: none !important; }
        .left-column:not(:has(.title:not(:empty))) .pill-badge { display: none !important; }
        .left-column:not(:has(.title:not(:empty))) .text { font-size: 38px !important; font-weight: 500 !important; line-height: 1.6 !important; }
        .content:not(:has(.title:not(:empty))) .text { font-size: 36px !important; line-height: 1.6 !important; }
        .header-section:not(:has(.video-title:not(:empty))) .title-accent-wrapper { display: none !important; }
        .top-letterbox:not(:has(.title-text:not(:empty))) .title-group { display: none !important; }
        .top-letterbox:not(:has(.title-text:not(:empty))) .scope-badge { display: none !important; }
        .header-zone:not(:has(.main-headline:not(:empty))) .topic-pill { display: none !important; }
        /* Trendlume short-video safe area: reserve the top and bottom gesture zones. */
        .video-title-wrapper {
            top: 168px;
            width: 820px;
            max-width: calc(100% - 140px);
            max-height: 210px;
            padding: 18px 28px;
        }

        .video-title {
            font-size: 60px;
            line-height: 1.2;
            white-space: normal;
            max-height: 150px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        .content {
            bottom: 360px;
            width: 820px;
            max-width: calc(100% - 140px);
        }

        .text {
            font-size: 36px;
            line-height: 1.45;
            max-height: 108px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        .footer {
            bottom: 170px;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            width: 820px;
            max-width: calc(100% - 140px);
        }
        /* Two-line title safety: keep CJK glyph bottoms inside the readable area. */
        .title,
        .video-title,
        .title-text,
        .main-headline {
            line-height: 1.24 !important;
            max-height: none !important;
        }

        .video-title-wrapper:has(.video-title) {
            max-height: 240px;
            overflow: visible;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 9:16 全屏动态视频槽位 -->
        <div class="video-overlay"></div>
        
        <!-- 顶部轻质毛玻璃悬浮标题微岛 -->
        <div class="video-title-wrapper">
            <div class="video-title">{{title}}</div>
        </div>
        
        <!-- 底部字幕与信息安全区保护层 -->
        <div class="bottom-protection-zone">
            <div class="content">
                <div class="text">{{text}}</div>
            </div>
            
            <div class="footer">
                <div class="author-section">
                    <div class="author">{{author}}</div>
                    <div class="author-desc">{{describe}}</div>
                </div>
                <div class="logo-section">
                    <div class="logo">{{brand}}</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-hide empty footer
        try {
            const footerEl = document.querySelector('.footer');
            if (footerEl && !footerEl.textContent.trim()) {
                footerEl.style.display = 'none';
            }
        } catch (e) {}

        function autoFitTitle(element, maxWidth, maxHeight, minSize, maxSize) {
            try {
                if (!element || !element.textContent || !element.textContent.trim()) return;
                
                const measure = document.createElement('span');
                measure.style.visibility = 'hidden';
                measure.style.position = 'absolute';
                measure.style.top = '-9999px';
                measure.style.left = '-9999px';
                measure.style.whiteSpace = 'normal';
                measure.style.overflowWrap = 'break-word';
                measure.style.width = maxWidth + 'px';
                measure.style.lineHeight = '1.25';
                
                const style = window.getComputedStyle(element);
                measure.style.fontFamily = style.fontFamily;
                measure.style.fontWeight = style.fontWeight;
                measure.style.letterSpacing = style.letterSpacing;
                measure.textContent = element.textContent;
                
                document.body.appendChild(measure);
                
                let low = minSize;
                let high = maxSize;
                let best = minSize;
                
                while (high - low > 0.5) {
                    const mid = (low + high) / 2;
                    measure.style.fontSize = mid + 'px';
                    if (measure.scrollHeight <= maxHeight && measure.scrollWidth <= maxWidth) {
                        best = mid;
                        low = mid;
                    } else {
                        high = mid;
                    }
                }
                
                document.body.removeChild(measure);
                element.style.fontSize = best + 'px';
            } catch (e) {
                console.error(e);
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            const titleEl = document.querySelector('.video-title');
            if (titleEl) {
            autoFitTitle(titleEl, 832, 210, 36, 64);
            }
        });
    </script>

<script>
    // Auto-collapse title and footer containers when empty
    try {
        const titleElements = document.querySelectorAll('.video-title, .title, .title-text, .main-headline');
        titleElements.forEach(el => {
            if (!el.textContent.trim()) {
                const wrapper = el.closest('.header-section, .video-title-wrapper, .title-group, .header-zone, .top-header');
                if (wrapper) wrapper.style.display = 'none';
                el.style.display = 'none';
            }
        });
        const footerElements = document.querySelectorAll('.footer, .footer-meta, .footer-author, .footer-signature, .footer-area, .footer-zone');
        footerElements.forEach(el => {
            const author = el.querySelector('.author, .author-text, .author-tag');
            const desc = el.querySelector('.author-desc, .author-description');
            const brand = el.querySelector('.logo, .brand, .brand-logo');
            const hasAuthor = author && author.textContent.trim();
            const hasDesc = desc && desc.textContent.trim();
            const hasBrand = brand && brand.textContent.trim();
            if (!hasAuthor && !hasDesc && !hasBrand && !el.textContent.trim()) {
                el.style.display = 'none';
            }
        });
    } catch (e) {}
</script>
</body>
</html>
