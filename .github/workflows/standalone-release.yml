name: Build standalone distributions

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Required CI checks
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.platform }} standalone executable
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: zip
            python: "3.12"
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
            python: "3.12"
          - os: macos-latest
            platform: macos
            archive: tar.gz
            python: "3.11"
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/standalone/.build/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            standalone/package-lock.json
            frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true
          version: "0.12.12"

      - name: Install standalone runtime binaries
        working-directory: standalone
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev --extra standalone

      - name: Install Playwright Chromium
        working-directory: backend
        run: uv run playwright install chromium

      - name: Verify PyInstaller
        working-directory: backend
        run: uv run python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Build standalone frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Build executable
        working-directory: backend
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          TRENDLUME_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TRENDLUME_STANDALONE_PLATFORM: ${{ matrix.platform }}
          TRENDLUME_STANDALONE_ARTIFACT: Trendlume-${{ matrix.platform }}-${{ runner.arch }}
        run: uv run python ../standalone/build_standalone.py

      - name: Upload standalone distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trendlume-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            standalone/dist/Trendlume-*.${{ matrix.archive }}
            standalone/dist/Trendlume-*.${{ matrix.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest tagged release artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download platform executables
        if: github.event.repository.visibility == 'public' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: trendlume-*
          path: attest
          merge-multiple: true

      - name: Generate artifact attestation
        if: github.event.repository.visibility == 'public' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attest/Trendlume-*.zip
            attest/Trendlume-*.tar.gz

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download platform executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: trendlume-*
          path: release
          merge-multiple: true

      - name: Verify release checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(./*.sha256)
          if [ "${#checksums[@]}" -eq 0 ]; then
            echo "No checksum files were downloaded" >&2
            exit 1
          fi
          sha256sum --check "${checksums[@]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
